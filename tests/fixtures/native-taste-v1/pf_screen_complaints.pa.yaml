                                  Control: Button
                                  Properties:
                                    Icon: =""
                                    Layout: ='ButtonCanvas.Layout'.TextOnly
                                    Text: ="Reset"
                                    AccessibleLabel: ="Reset"
                                    OnSelect: =If(!(pf_ds2_complaints_editor || pf_ds2_complaints_busy), Reset(pf_ds2_complaints_search); Set(pf_ds2_complaints_filter, "All"); Set(pf_ds2_complaints_descending, false))
