                            Control: Avatar
                            Properties:
                              Name: =User().FullName
                              AccessibleLabel: =User().FullName
                              Badge: ='Avatar.Badge'.None
                              Width: =32
                              Height: =32
                              BasePaletteColor: =PF_brand
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                      Variant: AutoLayout
                  - pf_ds2_complaints_content:
                      Control: GroupContainer
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =PF_gap
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Height: =0
                        PaddingLeft: =PF_pagePadding
                        PaddingRight: =PF_pagePadding
                        PaddingTop: =PF_spaceLg
                        PaddingBottom: =PF_spaceLg
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - pf_ds2_complaints_pageHeader:
                            Control: GroupContainer
                            Properties:
                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =If(PF_mobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =PF_gap
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              Height: =If(PF_mobile, 132, 88)
                            Children:
                              - pf_ds2_complaints_pageTitle:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =200
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =PF_spaceXs
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    Height: =80
                                  Children:
                                    - pf_ds2_complaints_pageTitle_title:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="All complaints"
                                          AccessibleLabel: ="All complaints"
                                          Color: =PF_text
                                          Size: =PF_typeTitle
                                          Height: =36
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          FontWeight: =FontWeight.Semibold
                                    - pf_ds2_complaints_pageTitle_subtitle:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Find, review and update records with confidence."
                                          AccessibleLabel: ="Find, review and update records with confidence."
                                          Color: =PF_muted
                                          Size: =PF_typeBody
                                          Height: =32
                                          AutoHeight: =true
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                  Variant: AutoLayout
                              - pf_ds2_complaints_pageActions:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =If(PF_mobile, Parent.Width, 284)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =PF_gap
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    Height: =Max(40, PF_controlHeight)
                                    LayoutJustifyContent: =LayoutJustifyContent.End
                                  Children:
                                    - pf_ds2_complaints_refresh:
                                        Control: Button
                                        Properties:
                                          Icon: ="ArrowClockwise"
                                          Layout: ='ButtonCanvas.Layout'.IconBefore
                                          Text: ="Refresh"
                                          AccessibleLabel: ="Refresh"
                                          OnSelect: =If(!(pf_ds2_complaints_editor || pf_ds2_complaints_busy), Set(pf_ds2_complaints_loading, true); Set(pf_ds2_complaints_loadError, ""); IfError(Refresh('Complaints'), Set(pf_ds2_complaints_loadError, FirstError.Message)); Set(pf_ds2_complaints_loading, false))
                                          Height: =PF_controlHeight
                                          Width: =112
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =PF_text
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                    - pf_ds2_complaints_new:
                                        Control: Button
                                        Properties:
                                          Icon: ="Add"
                                          Layout: ='ButtonCanvas.Layout'.IconBefore
                                          Text: ="New complaint"
                                          AccessibleLabel: ="New complaint"
                                          OnSelect: =If(!(pf_ds2_complaints_editor || pf_ds2_complaints_busy), NewForm(pf_ds2_complaints_form); Set(pf_ds2_complaints_step, 1); Set(pf_ds2_complaints_editor, true); Set(pf_ds2_complaints_receipt, false); Reset(pf_ds2_complaints_reason); SetFocus(pf_ds2_complaints_cancel))
                                          Height: =PF_controlHeight
                                          Width: =156
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =PF_onBrand
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                  Variant: AutoLayout
                            Variant: AutoLayout
                        - pf_ds2_complaints_toolbar:
                            Control: GroupContainer
                            Properties:
                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =PF_spaceSm
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              Height: =If(PF_mobile, 152, If(PF_tablet, 88, 44))
                              LayoutWrap: =true
                            Children:
                              - pf_ds2_complaints_search:
                                  Control: TextInput
                                  Properties:
                                    Width: =If(PF_mobile, Parent.Width, 280)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    AccessibleLabel: ="Find a complaint"
                                    Placeholder: ="Find a complaint"
                                    Value: =""
                                    Height: =PF_controlHeight
                                    FontSize: =PF_typeBody
                                    FontColor: =PF_text
                                    Fill: =PF_subtle
                                    BorderRadius: =PF_radius
                                    Appearance: ='TextInputCanvas.Appearance'.FilledLighter
                                    Type: ='TextInputCanvas.Type'.Search
                                    TriggerOutput: ='TextInputCanvas.TriggerOutput'.Delayed
                                    DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                    OnChange: =Set(pf_ds2_complaints_selected, Blank()); Set(pf_ds2_complaints_reveal, false)
                              - pf_ds2_complaints_filters:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =308
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =PF_spaceXs
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    Height: =Max(40, PF_controlHeight)
                                  Children:
                                    - pf_ds2_complaints_filters_0:
                                        Control: Button
                                        Properties:
                                          Icon: =""
                                          Layout: ='ButtonCanvas.Layout'.TextOnly
                                          Text: ="All"
                                          AccessibleLabel: '="Priority: All"'
                                          OnSelect: =Set(pf_ds2_complaints_filter, "All"); Set(pf_ds2_complaints_selected, Blank()); Set(pf_ds2_complaints_reveal, false)
                                          Height: =PF_controlHeight
                                          Width: =64
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =If(Coalesce(pf_ds2_complaints_filter, "All") = "All", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =If(Coalesce(pf_ds2_complaints_filter, "All") = "All", PF_onBrand, PF_text)
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                    - pf_ds2_complaints_filters_1:
                                        Control: Button
                                        Properties:
                                          Icon: =""
                                          Layout: ='ButtonCanvas.Layout'.TextOnly
                                          Text: ="Low"
                                          AccessibleLabel: '="Priority: Low"'
                                          OnSelect: =Set(pf_ds2_complaints_filter, "Low"); Set(pf_ds2_complaints_selected, Blank()); Set(pf_ds2_complaints_reveal, false)
                                          Height: =PF_controlHeight
                                          Width: =64
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =If(Coalesce(pf_ds2_complaints_filter, "All") = "Low", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =If(Coalesce(pf_ds2_complaints_filter, "All") = "Low", PF_onBrand, PF_text)
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                    - pf_ds2_complaints_filters_2:
                                        Control: Button
                                        Properties:
                                          Icon: =""
                                          Layout: ='ButtonCanvas.Layout'.TextOnly
                                          Text: ="Normal"
                                          AccessibleLabel: '="Priority: Normal"'
                                          OnSelect: =Set(pf_ds2_complaints_filter, "Normal"); Set(pf_ds2_complaints_selected, Blank()); Set(pf_ds2_complaints_reveal, false)
                                          Height: =PF_controlHeight
                                          Width: =72
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =If(Coalesce(pf_ds2_complaints_filter, "All") = "Normal", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =If(Coalesce(pf_ds2_complaints_filter, "All") = "Normal", PF_onBrand, PF_text)
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                    - pf_ds2_complaints_filters_3:
                                        Control: Button
                                        Properties:
                                          Icon: =""
                                          Layout: ='ButtonCanvas.Layout'.TextOnly
                                          Text: ="High"
                                          AccessibleLabel: '="Priority: High"'
                                          OnSelect: =Set(pf_ds2_complaints_filter, "High"); Set(pf_ds2_complaints_selected, Blank()); Set(pf_ds2_complaints_reveal, false)
                                          Height: =PF_controlHeight
                                          Width: =64
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =If(Coalesce(pf_ds2_complaints_filter, "All") = "High", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                                          FontSize: =PF_typeBody
                                          FontWeight: =FontWeight.Semibold
                                          FontColor: =If(Coalesce(pf_ds2_complaints_filter, "All") = "High", PF_onBrand, PF_text)
                                          BasePaletteColor: =PF_brand
                                          BorderRadius: =PF_radius
                                          DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
                                  Variant: AutoLayout
                              - pf_ds2_complaints_sort:
                                  Control: Button
                                  Properties:
                                    Icon: ="ArrowSort"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    Text: =If(pf_ds2_complaints_descending, "Title Z–A", "Title A–Z")
                                    AccessibleLabel: =If(pf_ds2_complaints_descending, "Title Z–A", "Title A–Z")
                                    OnSelect: =If(!(pf_ds2_complaints_editor || pf_ds2_complaints_busy), Set(pf_ds2_complaints_descending, !pf_ds2_complaints_descending))
                                    Height: =PF_controlHeight
                                    Width: =112
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    FontSize: =PF_typeBody
                                    FontWeight: =FontWeight.Semibold
                                    FontColor: =PF_text
                                    BasePaletteColor: =PF_brand
                                    BorderRadius: =PF_radius
                                    DisplayMode: =If(pf_ds2_complaints_editor || pf_ds2_complaints_busy, DisplayMode.Disabled, DisplayMode.Edit)
