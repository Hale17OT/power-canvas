                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Label: ="Loading complaints"
                              AccessibleLabel: ="Loading complaints"
                              Height: =72
                              SpinnerSize: ='Spinner.SpinnerSize'.Small
                              FontSize: =PF_typeBody
                              FontColor: =PF_muted
