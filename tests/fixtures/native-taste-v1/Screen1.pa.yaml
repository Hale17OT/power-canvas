                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: =Text(CountIf('Complaints', 'Priority' = LookUp(Choices('Complaints'.'Priority'), Text(Value) = "High").Value), "0")
