                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Prioritize your next review"
                                          AccessibleLabel: ="Prioritize your next review"
                                          Color: =PF_muted
                                          Size: =PF_typeCaption
                                          Height: =22
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                  Variant: AutoLayout
                              - pf_ds2_dashboard_kpi2:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =If(PF_mobile, Parent.Width, (Parent.Width - 32) / 3)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =PF_spaceXs
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =PF_radius
                                    RadiusTopRight: =PF_radius
                                    RadiusBottomLeft: =PF_radius
                                    RadiusBottomRight: =PF_radius
                                    Fill: =PF_surface
                                    PaddingLeft: =PF_spaceLg
                                    PaddingRight: =PF_spaceLg
                                    PaddingTop: =PF_spaceLg
                                    PaddingBottom: =PF_spaceLg
                                    Height: =148
                                  Children:
                                    - pf_ds2_dashboard_kpi2_label:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Normal"
