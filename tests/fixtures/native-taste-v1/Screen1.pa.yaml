Screens:
  Screen1:
    Properties:
      Fill: =PF_canvas
      OnVisible: =Set(pf_ds2_dashboard_loading, true); Set(pf_ds2_dashboard_loadError, ""); IfError(Refresh('Complaints'), Set(pf_ds2_dashboard_loadError, FirstError.Message)); Set(pf_ds2_dashboard_loading, false)
    Children:
      - pf_ds2_dashboard_root:
          Control: GroupContainer
          Properties:
            Width: =Parent.Width
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            FillPortions: =0
            AlignInContainer: =AlignInContainer.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            Height: =Parent.Height - If(PF_mobile, 64, 0)
          Children:
            - pf_ds2_dashboard_sidebar:
                Control: GroupContainer
                Properties:
                  Width: =PF_navWidth
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =PF_gap
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Height: =Parent.Height
                  Fill: =PF_rail
                  PaddingLeft: =PF_spaceInset
                  PaddingRight: =PF_spaceInset
                  PaddingTop: =PF_spaceInset
                  PaddingBottom: =PF_spaceMd
                  Visible: =!PF_mobile
                Children:
                  - pf_ds2_dashboard_sidebar_brand:
                      Control: ModernText
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Text: ="PowerCanvas"
                        AccessibleLabel: ="PowerCanvas"
                        Color: =PF_railText
                        Size: =PF_typeBrand
                        Height: =64
                        AutoHeight: =false
                        Font: =PF_font
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                        Visible: =!PF_tablet
                  - pf_ds2_dashboard_sidebar_section:
                      Control: ModernText
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Text: ="WORKSPACE"
                        AccessibleLabel: ="WORKSPACE"
                        Color: =PF_railMuted
                        Size: =PF_typeEyebrow
                        Height: =28
                        AutoHeight: =false
                        Font: =PF_font
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Visible: =!PF_tablet
                  - pf_ds2_dashboard_sidebar_item0:
                      Control: Button
                      Properties:
                        Icon: ="Home"
                        Layout: =If(PF_tablet, 'ButtonCanvas.Layout'.IconOnly, 'ButtonCanvas.Layout'.IconBefore)
                        Text: =If(PF_tablet, "", "Overview")
                        AccessibleLabel: ="Overview"
                        OnSelect: =If(!(false), Navigate(Screen1, PF_navigationTransition))
                        Height: =44
                        Width: =Parent.Width - 24
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        FontSize: =PF_typeBody
                        FontWeight: =FontWeight.Semibold
                        FontColor: =PF_railText
                        BasePaletteColor: =PF_brand
                        BorderRadius: =PF_radius
                        Align: =Align.Left
                        DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                  - pf_ds2_dashboard_sidebar_item1:
                      Control: Button
                      Properties:
                        Icon: ="Document"
                        Layout: =If(PF_tablet, 'ButtonCanvas.Layout'.IconOnly, 'ButtonCanvas.Layout'.IconBefore)
                        Text: =If(PF_tablet, "", "Complaints")
                        AccessibleLabel: ="Complaints"
                        OnSelect: =If(!(false), Navigate(pf_screen_complaints, PF_navigationTransition))
                        Height: =44
                        Width: =Parent.Width - 24
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontSize: =PF_typeBody
                        FontWeight: =FontWeight.Semibold
                        FontColor: =PF_railText
                        BasePaletteColor: =PF_brand
                        BorderRadius: =PF_radius
                        Align: =Align.Left
                        DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                  - pf_ds2_dashboard_sidebar_spacer:
                      Control: GroupContainer
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =PF_gap
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Height: =0
                      Children: []
                      Variant: AutoLayout
                  - pf_ds2_dashboard_sidebar_foot:
                      Control: ModernText
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Text: ="POWERCANVAS / WORKSPACE"
                        AccessibleLabel: ="POWERCANVAS / WORKSPACE"
                        Color: =PF_railMuted
                        Size: =PF_typeCaption
                        Height: =24
                        AutoHeight: =false
                        Font: =PF_font
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Visible: =!PF_tablet
                Variant: AutoLayout
            - pf_ds2_dashboard_main:
                Control: GroupContainer
                Properties:
                  Width: =Parent.Width - PF_navWidth
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Height: =Parent.Height
                Children:
                  - pf_ds2_dashboard_header:
                      Control: GroupContainer
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =PF_gap
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Height: =PF_headerHeight
                        Fill: =PF_surface
                        PaddingLeft: =PF_pagePadding
                        PaddingRight: =PF_pagePadding
                      Children:
                        - pf_ds2_dashboard_workspaceName:
                            Control: ModernText
                            Properties:
                              Width: =100
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Text: ="PowerCanvas • Complaint desk"
                              AccessibleLabel: ="PowerCanvas • Complaint desk"
                              Color: =PF_text
                              Size: =PF_typeBody
                              Height: =36
                              AutoHeight: =false
                              Font: =PF_font
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              FontWeight: =FontWeight.Semibold
                        - pf_ds2_dashboard_theme:
                            Control: Button
                            Properties:
                              Icon: =""
                              Layout: ='ButtonCanvas.Layout'.TextOnly
                              Text: ="Theme"
                              AccessibleLabel: ="Theme"
                              OnSelect: =Set(pf_dark, !PF_dark)
                              Height: =PF_controlHeight
                              Width: =88
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              FontSize: =PF_typeBody
                              FontWeight: =FontWeight.Semibold
                              FontColor: =PF_text
                              BasePaletteColor: =PF_brand
                              BorderRadius: =PF_radius
                              DisplayMode: =If(false, DisplayMode.Disabled, DisplayMode.Edit)
                        - pf_ds2_dashboard_avatar:
                            Control: Avatar
                            Properties:
                              Name: =User().FullName
                              AccessibleLabel: =User().FullName
                              Badge: ='Avatar.Badge'.None
                              Width: =32
                              Height: =32
                              BasePaletteColor: =PF_brand
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                      Variant: AutoLayout
                  - pf_ds2_dashboard_content:
                      Control: GroupContainer
                      Properties:
                        Width: =Parent.Width
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =PF_gap
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Height: =0
                        PaddingLeft: =PF_pagePadding
                        PaddingRight: =PF_pagePadding
                        PaddingTop: =PF_spaceLg
                        PaddingBottom: =PF_spaceLg
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - pf_ds2_dashboard_pageHeader:
                            Control: GroupContainer
                            Properties:
                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =If(PF_mobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =PF_gap
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              Height: =If(PF_mobile, 132, 88)
                            Children:
                              - pf_ds2_dashboard_pageTitle:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =200
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =PF_spaceXs
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    Height: =80
                                  Children:
                                    - pf_ds2_dashboard_pageTitle_title:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Workspace overview"
                                          AccessibleLabel: ="Workspace overview"
                                          Color: =PF_text
                                          Size: =PF_typeTitle
                                          Height: =36
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          FontWeight: =FontWeight.Semibold
                                    - pf_ds2_dashboard_pageTitle_subtitle:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Start with a complaint. Reveal details when you need them."
                                          AccessibleLabel: ="Start with a complaint. Reveal details when you need them."
                                          Color: =PF_muted
                                          Size: =PF_typeBody
                                          Height: =32
                                          AutoHeight: =true
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                  Variant: AutoLayout
                              - pf_ds2_dashboard_pageActions:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =If(PF_mobile, Parent.Width, 284)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =PF_gap
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    Height: =Max(40, PF_controlHeight)
                                    LayoutJustifyContent: =LayoutJustifyContent.End
                                  Children: []
                                  Variant: AutoLayout
                            Variant: AutoLayout
