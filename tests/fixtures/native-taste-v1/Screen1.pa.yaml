                                          Text: =Text(CountIf('Complaints', 'Priority' = LookUp(Choices('Complaints'.'Priority'), Text(Value) = "Normal").Value), "0")
                                          AccessibleLabel: =Text(CountIf('Complaints', 'Priority' = LookUp(Choices('Complaints'.'Priority'), Text(Value) = "Normal").Value), "0")
