                                  Variant: AutoLayout
                            Variant: AutoLayout
                        - pf_ds2_dashboard_empty:
                            Control: GroupContainer
                            Properties:
                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
