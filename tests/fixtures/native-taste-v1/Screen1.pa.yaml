                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Prioritize your next review"
                                          AccessibleLabel: ="Prioritize your next review"
                                          Color: =PF_muted
                                          Size: =PF_typeCaption
                                          Height: =22
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
