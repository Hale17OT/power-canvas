                              Width: =Parent.Width
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =If(PF_mobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =PF_spaceMd
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              Height: =If(PF_mobile, 476, 148)
                            Children:
                              - pf_ds2_dashboard_kpi0:
                                  Control: GroupContainer
                                  Properties:
                                    Width: =If(PF_mobile, Parent.Width, (Parent.Width - 32) / 3)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Start
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =PF_spaceXs
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =PF_radius
                                    RadiusTopRight: =PF_radius
                                    RadiusBottomLeft: =PF_radius
                                    RadiusBottomRight: =PF_radius
                                    Fill: =PF_surface
                                    PaddingLeft: =PF_spaceLg
                                    PaddingRight: =PF_spaceLg
                                    PaddingTop: =PF_spaceLg
                                    PaddingBottom: =PF_spaceLg
                                    Height: =148
                                  Children:
                                    - pf_ds2_dashboard_kpi0_label:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: ="Accessible records"
                                          AccessibleLabel: ="Accessible records"
                                          Color: =PF_muted
                                          Size: =PF_typeCaption
                                          Height: =24
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                    - pf_ds2_dashboard_kpi0_value:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Text: =Text(CountIf('Complaints', true), "0")
                                          AccessibleLabel: =Text(CountIf('Complaints', true), "0")
                                          Color: =PF_text
                                          Size: =PF_typeMetric
                                          Height: =42
                                          AutoHeight: =false
                                          Font: =PF_font
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          FontWeight: =FontWeight.Semibold
                                    - pf_ds2_dashboard_kpi0_caption:
                                        Control: ModernText
                                        Properties:
                                          Width: =Parent.Width
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
