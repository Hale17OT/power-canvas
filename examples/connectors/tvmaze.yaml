apiVersion: powercanvas.connectors/v1alpha1
name: pfx_PowerCanvasTVMaze
title: PowerCanvas TVmaze media test
baseUrl: https://api.tvmaze.com
auth: { type: none }
operations:
  - id: SearchShows
    summary: Search shows and poster images
    method: GET
    path: /search/shows
    parameters:
      - { name: q, type: string, required: true }
    response:
      collection: true
      collectionFormat: array
      fields:
        - { name: score, type: number }
        - name: show
          type: object
          fields:
            - { name: id, type: integer }
            - { name: name, type: string }
            - { name: url, type: string }
            - { name: language, type: string, nullable: true }
            - { name: status, type: string }
            - name: image
              type: object
              nullable: true
              fields:
                - { name: medium, type: string }
                - { name: original, type: string }
