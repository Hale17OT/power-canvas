    approval:
      purpose: Compile-only reusable workflow capability fixture. No live business
        automation.
      flow:
        logicalName: pfx_V3Approval
        displayName: V3 Approval
        flowType: automated
        trigger:
          type: dataverse
          connection: dv
          table: pfx_v3requests
          metadata: requests
          changeType: rowAdded
          scope: user
        connectionReferences:
          - approvals
          - dv
          - mail
        environmentVariables:
          - site
          - drive
          - templateFile
          - approver
        runPolicy:
          mode: controlledWrite
        role: parent
      steps:
        - name: Review
          recipe: approval
          mode: startAndWait
          timeoutHours: 24
          request:
            name: Request
            use: approvals.startAndWait
            connection: approvals
            approvalType: firstToRespond
            assignedTo:
              - op: environment
                name: approver
            title:
              op: trigger
              path:
                - pfx_title
            enableNotifications: true
            timeoutHours: 24
          onApproved:
            - name: Generate
              recipe: childWorkflow
              flow: document
              arguments:
                title:
                  op: trigger
                  path:
                    - pfx_title
            - name: NotifyApproved
              recipe: notification
              send:
                name: NotifyApproved
                use: outlook.sendEmail
                connection: mail
                to:
                  - op: environment
                    name: approver
                subject:
                  op: literal
                  value: Compile-only workflow example
                  shape:
                    type: string
                body:
                  op: output
                  name: Generate
                  path:
                    - pdfIdentifier
              errorBehavior: stop
              idempotencyIntent: Operator reviews unknown outcomes before resubmission.
          onRejected:
            - name: NotifyRejected
              recipe: notification
              send:
                name: NotifyRejected
                use: outlook.sendEmail
                connection: mail
                to:
                  - op: environment
                    name: approver
                subject:
                  op: literal
                  value: Compile-only workflow example
                  shape:
                    type: string
                body:
                  op: literal
                  value: Request rejected
                  shape:
                    type: string
              errorBehavior: stop
              idempotencyIntent: Operator reviews unknown outcomes before resubmission.
      idempotency:
        mode: operatorReviewed
        rationale: No runtime permission or target is configured in this fixture.
      correlation:
        correlationId:
          op: newGuid
        sourceRecordId:
          op: trigger
          path:
            - pfx_requestid
        parentRunContext:
          op: runId
