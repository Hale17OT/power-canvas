  executionPolicy:
    allowRead: true
    allowInternalWrite: false
    allowExternalWrite: false
    allowDestructive: false
  flows:
    dataverseRead:
      logicalName: pfx_ExperimentV2DataverseRead
      displayName: PowerCanvas V2 DataverseRead
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: scheduled
      trigger:
        type: recurrence
        frequency: Day
        interval: 1
        startTime: 2030-01-01T00:00:00Z
      actions:
        - name: Read
          use: dataverse.listRows
          connection: dv
          table: pfx_experimentcategories
          metadata: categories
          select:
            - pfx_experimentcategoryid
            - pfx_experimentname
          top: 1
      connectionReferences:
        - dv
      environmentVariables: []
      runPolicy:
        mode: readOnly
    dataverseWrite:
      logicalName: pfx_ExperimentV2DataverseWrite
      displayName: PowerCanvas V2 DataverseWrite
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: scheduled
      trigger:
        type: recurrence
        frequency: Day
        interval: 1
        startTime: 2030-01-01T00:00:00Z
      actions:
        - name: Add
          use: dataverse.addRow
          connection: dv
          table: pfx_experimentcategories
          metadata: categories
          fields:
            pfx_experimentname:
              op: literal
              value: PowerCanvas compile-only example
              shape:
                type: string
        - name: Update
          use: dataverse.updateRow
          connection: dv
          table: pfx_experimentcategories
          metadata: categories
          id:
            op: output
            name: Add
            path:
              - pfx_experimentcategoryid
          fields:
            pfx_experimentname:
              op: literal
              value: PowerCanvas compile-only updated example
              shape:
                type: string
          idempotency:
            mode: targetIdentity
            rationale: Only update the identity returned by this invocation; creation still needs deduplication.
      connectionReferences:
        - dv
      environmentVariables: []
      runPolicy:
        mode: controlledWrite
    dataverseEvent:
      logicalName: pfx_ExperimentV2DataverseEvent
      displayName: PowerCanvas V2 DataverseEvent
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: automated
      trigger:
        type: dataverse
        connection: dv
        table: pfx_experimentcategories
        metadata: categories
        changeType: rowModified
        scope: user
        selectColumns:
          - pfx_experimentname
      actions:
        - name: Observed
          use: data.compose
          value:
            op: literal
            value: Event received
            shape:
              type: string
      connectionReferences:
        - dv
      environmentVariables: []
      runPolicy:
        mode: readOnly
    sharepointRead:
      logicalName: pfx_ExperimentV2SharePointRead
      displayName: PowerCanvas V2 SharePointRead
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: scheduled
      trigger:
        type: recurrence
        frequency: Day
        interval: 1
        startTime: 2030-01-01T00:00:00Z
      actions:
        - name: Read
          use: sharepoint.getItems
          connection: sp
          site:
            op: environment
            name: site
          list:
            op: environment
            name: list
          metadata: list
          top: 5
      connectionReferences:
        - sp
      environmentVariables:
        - site
        - list
      runPolicy:
        mode: readOnly
    sharepointWrite:
      logicalName: pfx_ExperimentV2SharePointWrite
      displayName: PowerCanvas V2 SharePointWrite
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: scheduled
      trigger:
        type: recurrence
        frequency: Day
        interval: 1
        startTime: 2030-01-01T00:00:00Z
      actions:
        - name: Create
          use: sharepoint.createItem
          connection: sp
          site:
            op: environment
            name: site
          list:
            op: environment
            name: list
          metadata: list
          fields:
            Title:
              op: literal
              value: PowerCanvas compile-only example
              shape:
                type: string
      connectionReferences:
        - sp
      environmentVariables:
        - site
        - list
      runPolicy:
        mode: controlledWrite
    outlookSend:
      logicalName: pfx_ExperimentV2OutlookSend
      displayName: PowerCanvas V2 OutlookSend
      description: Compile fixture; disabled deployment only. No safe execution target or authenticated connection is configured.
      flowType: scheduled
      trigger:
        type: recurrence
        frequency: Day
        interval: 1
        startTime: 2030-01-01T00:00:00Z
      actions:
        - name: Send
          use: outlook.sendEmail
          connection: outlook
          to:
            - op: environment
              name: mailbox
          subject:
            op: literal
            value: PowerCanvas compile-only proof
            shape:
              type: string
          body:
            op: literal
            value: No email is sent by compilation or deployment.
            shape:
              type: string
      connectionReferences:
        - outlook
      environmentVariables:
        - mailbox
      runPolicy:
        mode: controlledWrite
